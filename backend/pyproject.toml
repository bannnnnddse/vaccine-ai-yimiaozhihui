[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaccine-ai-backend"
version = "0.1.0"
description = "疫苗知识 AI 小助手基础问答后端"
requires-python = ">=3.10"
dependencies = [
  "argon2-cffi>=23.1,<26.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "mcp>=1.27,<2.0",
  "numpy>=2.0,<3.0",
  "openai>=1.99,<3.0",
  "pillow>=11.0,<13.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "requests>=2.32,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
  "chromadb==1.5.9",
  "defusedxml>=0.7,<1.0",
  "pymupdf>=1.26,<2.0",
  "sentence-transformers>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
